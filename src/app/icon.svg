<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The AND truth table as a 2×2 grid: only the (1,1) cell is lit. Same mark as the site logo. -->
  <style>
    .cell { fill: none; stroke: #172036; }
    @media (prefers-color-scheme: dark) { .cell { stroke: #e6e9f0; } }
  </style>
  <rect class="cell" x="2.5" y="2.5" width="12" height="12" rx="3" stroke-width="2.5" />
  <rect class="cell" x="17.5" y="2.5" width="12" height="12" rx="3" stroke-width="2.5" />
  <rect class="cell" x="2.5" y="17.5" width="12" height="12" rx="3" stroke-width="2.5" />
  <rect x="16.25" y="16.25" width="14.5" height="14.5" rx="3.5" fill="#4644c9" />
</svg>
